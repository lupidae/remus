name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

jobs:
  # upload-rust-binary-action uploads to a release; it does not create one, and
  # six jobs polling for a release nobody made is six jobs failing.
  create-release:
    name: create the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Create it unless a re-run already did
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, reusing it"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

  binaries:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl first: the static one is what the README promises.
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-unknown-linux-gnu,   os: ubuntu-latest }
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # Cross-compiles where the host cannot, archives, checksums, and attaches
      # everything to the release for this tag.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: remus
          target: ${{ matrix.target }}
          # github.ref is a branch on a manual run, so name the tag explicitly.
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          archive: $bin-$target
          include: README.md,LICENSE-MIT,LICENSE-APACHE
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  crates-io:
    # Reusable, so the same steps can be re-run on their own when a publish
    # half-lands without dragging the binaries through it again.
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  container:
    name: ghcr image
    # Waits for the binaries rather than rebuilding them: the image then carries
    # the exact bytes the release ships, and costs seconds instead of the forty
    # minutes an emulated arm64 Rust build was taking.
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Take the static binaries from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern 'remus-*-unknown-linux-musl.tar.gz' --dir dist --clobber
          tar -xzOf dist/remus-x86_64-unknown-linux-musl.tar.gz remus > remus-amd64
          tar -xzOf dist/remus-aarch64-unknown-linux-musl.tar.gz remus > remus-arm64
          chmod +x remus-amd64 remus-arm64
      # No setup-qemu-action: the Dockerfile only copies, so nothing has to run
      # under emulation to build either architecture.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
