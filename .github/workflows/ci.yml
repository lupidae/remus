name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      # No database is needed: the emitters are tested against a committed
      # introspection, so this is the same gate on every platform.
      - run: cargo test --workspace --doc
      # The slim build is a supported way to install, so it is a tested one.
      - run: cargo test -p remus --no-default-features --all-targets
      # Off by default but shipped in every release binary.
      - run: cargo test -p remus --features push --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustfmt.toml uses imports_granularity/group_imports, which are nightly-only.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p remus --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p remus --features push --all-targets -- -D warnings

  roundtrip:
    name: roundtrip (PostgreSQL 16, 17, 18)
    runs-on: ubuntu-latest
    # The tests above never see a server. This is the one place that proves the
    # SQL output replays and that every major reads a schema into the same
    # payload: 17 and 18 each catalogue NOT NULL somewhere 16 does not.
    services:
      pg16:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5416:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      pg17:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5417:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      pg18:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5418:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # psql is the runner's own client; plain SQL files need nothing newer.
      - run: >-
          just roundtrip
          "postgres://postgres:postgres@127.0.0.1:5416/postgres
          postgres://postgres:postgres@127.0.0.1:5417/postgres
          postgres://postgres:postgres@127.0.0.1:5418/postgres"

  package:
    name: publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches a broken manifest, a missing readme or an unpackageable file
      # here, rather than at the tag, where the version number is already spent.
      - run: cargo publish --workspace --dry-run --locked

  msrv:
    name: msrv (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: SebRollen/toml-action@v1.2.0
        id: msrv
        with:
          file: Cargo.toml
          field: workspace.package.rust-version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.value }}
      - uses: Swatinem/rust-cache@v2
      # A declared floor nobody compiles against is a guess.
      - run: cargo check --workspace --all-targets
